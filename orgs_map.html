<!DOCTYPE html>
<html>
<head>
  <title>Organization Sites Map</title>
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    
    .map-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      background-color: #800000;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .map-btn:hover {
      background-color: #600000;
    }

    /* Custom Permanent Label Badge */
    .pin-label-container {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: #800000;
      color: #ffffff;
      padding: 4px 8px;
      border-radius: 16px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      border: 2px solid #ffffff;
      white-space: nowrap;
      cursor: pointer;
    }
    .pin-label-container:hover {
      background-color: #600000;
    }
    .pin-dot {
      width: 8px;
      height: 8px;
      background-color: #ffffff;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <button id="open-all-btn" class="map-btn" style="display:none;">Open All Sites in Google Maps</button>
  <div id="map"></div>

  <script>
    async function initMap() {
      const urlParams = new URLSearchParams(window.location.search);
      const rawAddresses = urlParams.get('addresses') || '';
      const addressList = rawAddresses.split('|').map(a => a.trim()).filter(a => a.length > 0);

      const defaultCenter = { lat: 39.7684, lng: -86.1581 };
      const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 11,
        center: defaultCenter,
        mapId: "50beb021f65373f29fb55e69",
        styles: [
          { featureType: "poi", elementType: "labels", stylers: [{ visibility: "off" }] },
          { featureType: "transit", elementType: "labels", stylers: [{ visibility: "off" }] }
        ]
      });

      if (addressList.length === 0) return;

      const joinedQuery = addressList.join(' | ');
      const fullMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(joinedQuery)}`;

      const btn = document.getElementById("open-all-btn");
      btn.style.display = "block";
      btn.onclick = () => window.open(fullMapsUrl, "_blank");

      map.addListener("click", (e) => {
        if (!e.placeId) {
          window.open(fullMapsUrl, "_blank");
        }
      });

      const geocoder = new google.maps.Geocoder();
      const bounds = new google.maps.LatLngBounds();
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const geocodePromises = addressList.map(entry => {
        return new Promise((resolve) => {
          let siteName = entry;
          let searchAddress = entry;

          if (entry.includes('@')) {
            const parts = entry.split('@');
            siteName = parts[0].trim();
            searchAddress = parts[1].trim();
          } else {
            siteName = entry.split(',')[0].trim();
          }

          geocoder.geocode({ address: searchAddress }, (results, status) => {
            if (status === "OK" && results[0]) {
              const pos = results[0].geometry.location;

              // Construct custom HTML element showing the site name permanently
              const customBadge = document.createElement("div");
              customBadge.className = "pin-label-container";
              customBadge.innerHTML = `<div class="pin-dot"></div><span>${siteName}</span>`;

              const marker = new AdvancedMarkerElement({
                map: map,
                position: pos,
                title: siteName + " - " + searchAddress,
                content: customBadge
              });

              marker.addListener("click", (evt) => {
                evt.domEvent.stopPropagation();
                const singleMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(searchAddress)}`;
                window.open(singleMapUrl, "_blank");
              });

              bounds.extend(pos);
              resolve(true);
            } else {
              console.error("Geocode failed for: " + searchAddress + " | Status: " + status);
              resolve(false);
            }
          });
        });
      });

      await Promise.all(geocodePromises);
      if (!bounds.isEmpty()) {
        map.fitBounds(bounds);
      }
    }
  </script>
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDHu2ZprL5d_BfhBCBX1wbV1ICyoaFlTkg&libraries=marker&callback=initMap">
  </script>
</body>
</html>
