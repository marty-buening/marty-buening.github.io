<!DOCTYPE html>
<html>
<head>
  <title>Organization Sites Map</title>
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    
    /* Overlay button styling */
    .map-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      background-color: #800000;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .map-btn:hover {
      background-color: #600000;
    }
  </style>
</head>
<body>
  <button id="open-all-btn" class="map-btn" style="display:none;">Open All Sites in Google Maps</button>
  <div id="map"></div>

  <script>
    async function initMap() {
      // 1. Parse 'addresses' parameter from URL
      const urlParams = new URLSearchParams(window.location.search);
      const rawAddresses = urlParams.get('addresses') || '';
      const addressList = rawAddresses.split('|').map(a => a.trim()).filter(a => a.length > 0);

      // 2. Initialize Map with POIs/landmarks hidden
      const defaultCenter = { lat: 39.7684, lng: -86.1581 };
      const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 11,
        center: defaultCenter,
        mapId: "50beb021f65373f29fb55e69",
        styles: [
          { featureType: "poi", elementType: "labels", stylers: [{ visibility: "off" }] },
          { featureType: "transit", elementType: "labels", stylers: [{ visibility: "off" }] }
        ]
      });

      if (addressList.length === 0) return;

      // Construct multi-site Google Maps URL
      const joinedQuery = addressList.join(' | ');
      const fullMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(joinedQuery)}`;

      // Setup top-right overlay button
      const btn = document.getElementById("open-all-btn");
      btn.style.display = "block";
      btn.onclick = () => window.open(fullMapsUrl, "_blank");

      // Also open full map when clicking blank space on the map background
      map.addListener("click", (e) => {
        // Only trigger if clicking map background (not a marker)
        if (!e.placeId) {
          window.open(fullMapsUrl, "_blank");
        }
      });

      const geocoder = new google.maps.Geocoder();
      const bounds = new google.maps.LatLngBounds();
      const { AdvancedMarkerElement, PinElement } = await google.maps.importLibrary("marker");

      // 3. Geocode each address wrapped in Promises
      const geocodePromises = addressList.map(address => {
        return new Promise((resolve) => {
          geocoder.geocode({ address: address }, (results, status) => {
            if (status === "OK" && results[0]) {
              const pos = results[0].geometry.location;

              // Maroon custom pin design
              const pin = new PinElement({
                background: "#800000",
                borderColor: "#FFFFFF",
                glyphColor: "#FFFFFF",
                scale: 1.2
              });

              const marker = new AdvancedMarkerElement({
                map: map,
                position: pos,
                title: address,
                content: pin.element
              });

              // Individual pin click opens just that site
              marker.addListener("click", (evt) => {
                evt.domEvent.stopPropagation(); // Prevents map background click from firing
                const singleMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
                window.open(singleMapUrl, "_blank");
              });

              bounds.extend(pos);
              resolve(true);
            } else {
              console.error("Geocode failed for: " + address + " | Status: " + status);
              resolve(false);
            }
          });
        });
      });

      // Wait for all geocoding calls to complete before fitting bounds
      await Promise.all(geocodePromises);
      if (!bounds.isEmpty()) {
        map.fitBounds(bounds);
      }
    }
  </script>
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDHu2ZprL5d_BfhBCBX1wbV1ICyoaFlTkg&libraries=marker&callback=initMap">
  </script>
</body>
</html>
