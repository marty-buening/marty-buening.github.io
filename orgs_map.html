<!DOCTYPE html>
<html>
<head>
  <title>Organization Sites Map</title>
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    async function initMap() {
      // 1. Parse 'addresses' parameter from URL
      const urlParams = new URLSearchParams(window.location.search);
      const rawAddresses = urlParams.get('addresses') || '';
      const addressList = rawAddresses.split('|').map(a => a.trim()).filter(a => a.length > 0);

      // 2. Initialize Map with POIs/landmarks hidden
      const defaultCenter = { lat: 39.7684, lng: -86.1581 };
      const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 11,
        center: defaultCenter,
        mapId: "50beb021f65373f29fb55e69", // Replace DEMO_MAP_ID with your actual Google Cloud Map ID
        styles: [
          { featureType: "poi", elementType: "labels", stylers: [{ visibility: "off" }] },
          { featureType: "transit", elementType: "labels", stylers: [{ visibility: "off" }] }
        ]
      });

      if (addressList.length === 0) return;

      const geocoder = new google.maps.Geocoder();
      const bounds = new google.maps.LatLngBounds();
      const { AdvancedMarkerElement, PinElement } = await google.maps.importLibrary("marker");

      // 3. Geocode each address wrapped in Promises
      const geocodePromises = addressList.map(address => {
        return new Promise((resolve) => {
          geocoder.geocode({ address: address }, (results, status) => {
            if (status === "OK" && results[0]) {
              const pos = results[0].geometry.location;

              const pin = new PinElement({
                background: "#10B981", // High-visibility green pin
                borderColor: "#FFFFFF",
                glyphColor: "#FFFFFF",
                scale: 1.2
              });

              new AdvancedMarkerElement({
                map: map,
                position: pos,
                title: address,
                content: pin.element
              });

              bounds.extend(pos);
              resolve(true);
            } else {
              console.error("Geocode failed for: " + address + " | Status: " + status);
              resolve(false);
            }
          });
        });
      });

      // Wait for all geocoding calls to complete before fitting bounds
      await Promise.all(geocodePromises);
      if (!bounds.isEmpty()) {
        map.fitBounds(bounds);
      }
    }
  </script>
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDHu2ZprL5d_BfhBCBX1wbV1ICyoaFlTkg&libraries=marker&callback=initMap">
  </script>
</body>
</html>
